<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Archive - Artwork Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
            background: linear-gradient(135deg, #3d5266 0%, #2c3e50 100%);
            min-height: 100vh;
            color: #2c3e50;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
        }

        /* Desktop Layout */
        .artwork-section {
            flex: 1;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2a3642;
        }

        .artwork-card {
            height: 90vh;
            aspect-ratio: 9 / 16;
            max-width: 100%;
            max-height: calc(100vh - 80px);
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            box-sizing: content-box;
            border: 6px solid #e0e0e0;
            position: relative;
        }

        #artwork-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .info-panel {
            width: 450px;
            padding: 40px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 30px;
            overflow-y: auto;
        }

        .artwork-title {
            font-size: clamp(36px, 3vw, 48px);
            font-weight: 700;
            color: #fff;
            text-align: center;
            letter-spacing: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        /* 參數顯示區 - Matches result.html */
        .params-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 380px;
        }

        .params-title {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
        }

        .param-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 16px;
        }

        .param-item:last-child {
            border-bottom: none;
        }

        .param-label {
            color: #555;
            font-weight: 600;
        }

        .param-value {
            color: #2c3e50;
            font-weight: 700;
            font-family: "Courier New", monospace;
        }

        /* GPU Resolution Notice */
        .resolution-notice {
            display: none;
            /* Hidden by default */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            line-height: 1.6;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            align-self: center;
            margin: 0 40px;
        }

        @media (max-width: 768px) {
            .resolution-notice {
                display: block;
                /* Show only on mobile */
                width: 100%;
                max-width: 380px;
                margin: 40px 0 0 0;
                align-self: center;
            }
        }

        /* Quality Selector */
        .quality-section {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .quality-section {
                display: none;
                /* Hide quality selector on mobile */
            }

            .download-section {
                display: none;
                /* Hide download button on mobile */
            }
        }

        .quality-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            letter-spacing: 1px;
        }

        .quality-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .quality-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .quality-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .quality-btn.active {
            background: #27ae60;
            border-color: #27ae60;
            box-shadow: 0 0 15px rgba(39, 174, 96, 0.4);
        }

        /* Download Button */
        .download-section {
            width: 100%;
            max-width: 380px;
            margin-top: 10px;
        }

        .download-btn {
            width: 100%;
            background-color: #2980b9;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background-color: #3498db;
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* Share Section */
        .share-section {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .share-url {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            word-break: break-all;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .copy-btn {
            background-color: #27ae60;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background-color: #2ecc71;
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.success {
            background-color: #219150;
        }

        /* Mobile Layout */
        @media (max-width: 768px) {
            body {
                overflow: auto;
            }

            .container {
                flex-direction: column;
                height: auto;
                background: transparent;
                backdrop-filter: none;
                align-items: center;
                padding: 40px 20px;
            }

            .artwork-section {
                width: 100%;
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: transparent;
                margin-bottom: 30px;
                /* Add distance from the info panel */
            }

            .artwork-card {
                height: 70vh;
                width: calc(70vh * 9 / 16);
                max-width: 100%;
                max-height: none;
                margin: 0 auto;
                border-width: 4px;
            }

            .info-panel {
                width: 100%;
                padding: 0;
                border-left: none;
                background: transparent;
                backdrop-filter: none;
                position: relative;
                min-height: auto;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            font-size: 24px;
            color: #fff;
            letter-spacing: 4px;
        }

        .lang-toggle-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 30px 20px 50px;
        }

        .lang-toggle-label {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
        }

        .lang-toggle-buttons {
            display: flex;
            gap: 12px;
        }

        .lang-toggle {
            padding: 12px 26px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background-color: rgba(44, 62, 80, 0.9);
            color: #fff;
            border: none;
            border-radius: 24px;
            letter-spacing: 1px;
            font-family: inherit;
            transition: transform 0.1s, background-color 0.2s;
        }

        .lang-toggle.active {
            background-color: #ffffff;
            color: #2c3e50;
        }
    </style>
    <link id="i18nStylesheet" rel="stylesheet" href="/css/i18n.zh.css">
</head>

<body>
    <div id="loading" class="loading-overlay i18n-archive-loading">載入作品中...</div>

    <div class="container">
        <div class="artwork-section">
            <div class="artwork-card">
                <iframe id="artwork-frame"></iframe>
            </div>
        </div>

        <div class="info-panel">
            <h1 class="artwork-title i18n-archive-title" id="artwork-title">作品名稱</h1>

            <div class="params-container">
                <!-- <div class="params-title">作品資訊</div> -->
                <div class="param-item">
                    <span class="param-label i18n-archive-param-label" id="label-iter">紀錄編號</span>
                    <span class="param-value" id="iter-id">-</span>
                </div>
                <div class="param-item">
                    <span class="param-label i18n-archive-param-label" id="label-subtype">生成類別</span>
                    <span class="param-value" id="val-subtype">-</span>
                </div>
                <div class="param-item">
                    <span class="param-label i18n-archive-param-label" id="label-p1">顏色參數</span>
                    <span class="param-value" id="val-p1">-</span>
                </div>
                <div class="param-item">
                    <span class="param-label i18n-archive-param-label" id="label-p2">密度參數</span>
                    <span class="param-value" id="val-p2">-</span>
                </div>
                <div class="param-item">
                    <span class="param-label i18n-archive-param-label" id="label-p3">混亂參數</span>
                    <span class="param-value" id="val-p3">-</span>
                </div>
            </div>

            <div class="share-section">
                <div class="share-url i18n-archive-share-url" id="share-link">正在產生分享連結...</div>
                <button class="copy-btn i18n-archive-copy-btn" id="copy-btn">分享此作品</button>
            </div>

            <div class="quality-section" id="quality-selector">
                <div class="quality-title i18n-archive-quality-title" id="quality-title">畫質設定 (Density)</div>
                <div class="quality-buttons">
                    <button class="quality-btn i18n-archive-quality-btn" data-level="low" onclick="setQuality('low')" id="quality-low">低 (Low)</button>
                    <button class="quality-btn i18n-archive-quality-btn" data-level="medium" onclick="setQuality('medium')" id="quality-medium">中 (Med)</button>
                    <button class="quality-btn i18n-archive-quality-btn" data-level="full" onclick="setQuality('full')" id="quality-full">高 (Full)</button>
                </div>
            </div>

            <div class="download-section">
                <button class="download-btn" onclick="downloadImage()">
                    <span class="i18n-archive-download-btn" id="download-btn-text">💾 下載作品圖片</span>
                </button>
            </div>
        </div>

        <div class="resolution-notice i18n-archive-resolution-notice">
            <strong id="notice-title">💡 瀏覽提示</strong>
            <p id="notice-body">
                由於本作品包含大量的 GPU 運算，行動裝置的解析度已大幅調降。
                若欲獲得最佳的視覺體驗，建議使用電腦瀏覽器開啟此頁面。
            </p>
        </div>
    </div>

    <div class="lang-toggle-section">
        <span class="lang-toggle-label i18n-archive-lang-toggle-label" id="lang-toggle-label">Language Switch: 中文 / English</span>
        <div class="lang-toggle-buttons">
            <button id="langToggleZh" class="lang-toggle i18n-archive-lang-toggle">中文</button>
            <button id="langToggleEn" class="lang-toggle i18n-archive-lang-toggle">English</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentDensityConfig = null;
        let currentArtworkData = null;
        let currentQualityLevel = 'low'; // Default for desktop
        const LANG_STORAGE_KEY = 'archive_lang';
        let currentLang = null;
        let i18nConfig = null;
        const i18nStylesheet = document.getElementById('i18nStylesheet');
        const langToggleZh = document.getElementById('langToggleZh');
        const langToggleEn = document.getElementById('langToggleEn');

        function detectPreferredLang() {
            const langs = navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language || ''];
            return langs.some(lang => lang.toLowerCase().startsWith('zh')) ? 'zh' : 'en';
        }

        function getInitialLang() {
            return localStorage.getItem(LANG_STORAGE_KEY) || detectPreferredLang();
        }

        async function fetchI18n() {
            try {
                const response = await fetch('/config/i18n');
                i18nConfig = await response.json();
            } catch (e) {
                console.error('Failed to load i18n config:', e);
            }
        }

        function getText(path, fallback = '') {
            if (!i18nConfig || !currentLang) return fallback;
            const base = i18nConfig[currentLang] || i18nConfig.zh || {};
            return path.split('.').reduce((acc, key) => acc && acc[key], base) || fallback;
        }

        function formatTemplate(template, params = {}) {
            return Object.entries(params).reduce(
                (result, [key, value]) => result.replaceAll(`{${key}}`, value),
                template
            );
        }

        function applyLangClass() {
            document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-TW';
            document.body.classList.remove('lang-zh', 'lang-en');
            document.body.classList.add(currentLang === 'en' ? 'lang-en' : 'lang-zh');
            if (i18nStylesheet) {
                i18nStylesheet.href = `/css/i18n.${currentLang === 'en' ? 'en' : 'zh'}.css`;
            }
        }

        function applyI18nText() {
            document.title = getText('pageTitle', 'Online Archive - Artwork Result');
            document.getElementById('loading').textContent = getText('loading', '載入作品中...');
            document.getElementById('artwork-title').textContent = getText('titlePlaceholder', '作品名稱');
            document.getElementById('label-iter').textContent = getText('labels.iterationId', '紀錄編號');
            document.getElementById('label-subtype').textContent = getText('labels.subtype', '生成類別');
            document.getElementById('label-p1').textContent = getText('labels.colorParam', '顏色參數');
            document.getElementById('label-p2').textContent = getText('labels.densityParam', '密度參數');
            document.getElementById('label-p3').textContent = getText('labels.chaosParam', '混亂參數');
            document.getElementById('share-link').textContent = getText('share.placeholder', '正在產生分享連結...');
            document.getElementById('copy-btn').textContent = getText('share.button', '分享此作品');
            document.getElementById('quality-title').textContent = getText('quality.title', '畫質設定 (Density)');
            document.getElementById('quality-low').textContent = getText('quality.low', '低 (Low)');
            document.getElementById('quality-medium').textContent = getText('quality.medium', '中 (Med)');
            document.getElementById('quality-full').textContent = getText('quality.full', '高 (Full)');
            document.getElementById('download-btn-text').textContent = getText('download.button', '💾 下載作品圖片');
            document.getElementById('notice-title').textContent = getText('notice.title', '💡 瀏覽提示');
            document.getElementById('notice-body').textContent = getText('notice.body', '由於本作品包含大量的 GPU 運算，行動裝置的解析度已大幅調降。若欲獲得最佳的視覺體驗，建議使用電腦瀏覽器開啟此頁面。');
            document.getElementById('lang-toggle-label').textContent =
                getText('langSwitchLabel', 'Language Switch: 中文 / English');
            if (langToggleZh) {
                langToggleZh.textContent = getText('langSwitchZh', '中文');
            }
            if (langToggleEn) {
                langToggleEn.textContent = getText('langSwitchEn', 'English');
            }
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem(LANG_STORAGE_KEY, lang);
            applyLangClass();
            applyI18nText();
            if (currentArtworkData) {
                updateArtworkText(currentArtworkData);
            }
            if (langToggleZh) {
                langToggleZh.classList.toggle('active', currentLang === 'zh');
            }
            if (langToggleEn) {
                langToggleEn.classList.toggle('active', currentLang === 'en');
            }
        }

        async function getDensityRatio() {
            try {
                const res = await fetch(`${API_BASE}/api/config/density`);
                if (!res.ok) throw new Error('Failed to fetch');
                currentDensityConfig = await res.json();

                if (window.innerWidth <= 768) {
                    currentQualityLevel = 'mobile';
                    return currentDensityConfig.mobile || 0.2;
                } else {
                    // Default to low setting for desktop view
                    currentQualityLevel = 'low';
                    return currentDensityConfig.lowDesktop || 0.4;
                }
            } catch (e) {
                console.error('Failed to load density config:', e);
                const isMobile = window.innerWidth <= 768;
                currentQualityLevel = isMobile ? 'mobile' : 'low';
                return isMobile ? 0.2 : 0.4;
            }
        }

        function setQuality(level) {
            if (!currentDensityConfig || !currentArtworkData) return;

            currentQualityLevel = level;
            let density = 1.0;
            if (level === 'low') {
                density = currentDensityConfig.lowDesktop || 0.4;
            } else if (level === 'medium') {
                density = currentDensityConfig.mediumDesktop || 0.75;
            } else if (level === 'full') {
                density = currentDensityConfig.fullDesktop || 1.0;
            }

            // Update UI
            document.querySelectorAll('.quality-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.level === level);
            });

            // Update Iframe
            updateArtworkIframe(density);
        }

        function updateArtworkIframe(density) {
            if (!currentArtworkData) return;
            const data = currentArtworkData;

            let folder = data.folder;
            const useSlim = (currentQualityLevel === 'mobile' || currentQualityLevel === 'low' || currentQualityLevel === 'medium');

            if (useSlim) {
                // Ensure folder starts with _slim
                if (!folder.startsWith('_slim')) {
                    folder = '_slim' + folder;
                }
            } else {
                // Ensure folder does not start with _slim
                if (folder.startsWith('_slim')) {
                    folder = folder.startsWith('_slim_') ? folder.substring(5) : folder.replace('_slim', '');
                }
            }

            const iframeUrl = `/artworks/${folder}/index.html?seed=${data.seed}&subtype=${data.subtype}&p1=${data.p1}&p2=${data.p2}&p3=${data.p3}&density=${density}`;
            document.getElementById('artwork-frame').src = iframeUrl;
        }

        function downloadImage() {
            console.log('Download button clicked');
            const iframe = document.getElementById('artwork-frame');
            if (iframe && iframe.contentWindow) {
                console.log('Sending saveImage message to iframe');
                iframe.contentWindow.postMessage('saveImage', '*');
            } else {
                console.error('Iframe or contentWindow not found');
            }
        }

        async function init() {
            currentLang = getInitialLang();
            await fetchI18n();
            applyLangClass();
            applyI18nText();
            if (langToggleZh) {
                langToggleZh.addEventListener('click', () => setLang('zh'));
            }
            if (langToggleEn) {
                langToggleEn.addEventListener('click', () => setLang('en'));
            }
            setLang(currentLang);
            const pathParts = window.location.pathname.split('/');
            const viewIdx = pathParts.indexOf('view');
            const iterationId = viewIdx !== -1 ? pathParts[viewIdx + 1] : null;

            const urlParams = new URLSearchParams(window.location.search);
            const artworkId = urlParams.get('id');

            if (iterationId && iterationId !== '') {
                // Case: Viewing an existing iteration
                await loadArtwork(iterationId);
            } else if (artworkId) {
                // Case: Saving a new iteration from URL parameters
                const data = {
                    id: artworkId,
                    seed: urlParams.get('seed'),
                    subtype: urlParams.get('subtype'),
                    p1: urlParams.get('p1'),
                    p2: urlParams.get('p2'),
                    p3: urlParams.get('p3')
                };

                try {
                    const response = await fetch(`${API_BASE}/api/save`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await response.json();
                    if (result.success) {
                        // Redirect to the view URL without query params
                        window.history.replaceState({}, '', `/view/${result.iterationId}`);
                        await loadArtwork(result.iterationId);
                    }
                } catch (e) {
                    console.error('Failed to save artwork:', e);
                    document.getElementById('loading').textContent = getText('errors.saveFailed', '儲存作品失敗');
                }
            } else {
                document.getElementById('loading').textContent = getText('errors.noArtwork', '未指定作品');
            }
        }

        async function loadArtwork(iterationId) {
            try {
                const response = await fetch(`${API_BASE}/api/load/${iterationId}`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('loading').textContent = getText('errors.notFound', '找不到該作品');
                    return;
                }

                // Try to fetch artwork config for subtype names
                try {
                    const configFolder = data.artworkId.toLowerCase();
                    const configUrl = `/artwork-configs/${configFolder}/${data.artworkId}.json`;
                    const configRes = await fetch(configUrl);
                    if (configRes.ok) {
                        const config = await configRes.json();
                        data.config = config;
                    }
                } catch (e) {
                    console.error('Failed to load artwork config:', e);
                }

                await displayData(data);
                document.getElementById('loading').style.display = 'none';
            } catch (e) {
                console.error('Failed to load artwork:', e);
                document.getElementById('loading').textContent = getText('errors.loadFailed', '載入作品失敗');
            }
        }

        function updateArtworkText(data) {
            currentArtworkData = data;
            const configTitle = currentLang === 'en'
                ? (data.config && data.config.title_en) || data.title
                : (data.config && data.config.title) || data.title;
            document.getElementById('artwork-title').textContent = configTitle || data.artworkId;
            document.getElementById('iter-id').textContent = '#' + data.iterationId;

            // Map subtype index to name if config is available
            let subtypeText = data.subtype !== null ? data.subtype : '-';
            const subtypeList = currentLang === 'en'
                ? (data.config && data.config.subtypes_en) || (data.config && data.config.subtypes)
                : data.config && data.config.subtypes;
            if (subtypeList && data.subtype !== null) {
                const subtypeIdx = parseInt(data.subtype);
                if (subtypeList[subtypeIdx]) {
                    subtypeText = subtypeList[subtypeIdx];
                }
            }
            document.getElementById('val-subtype').textContent = subtypeText;

            document.getElementById('val-p1').textContent = data.p1 || '-';
            document.getElementById('val-p2').textContent = data.p2 || '-';
            document.getElementById('val-p3').textContent = data.p3 || '-';

            const shareLink = `${window.location.origin}/view/${data.iterationId}`;
            const shareLinkEl = document.getElementById('share-link');
            shareLinkEl.textContent = shareLink;

            document.getElementById('copy-btn').onclick = async () => {
                const shareTitle = formatTemplate(
                    getText('share.titleTemplate', '線上典藏 - {title}'),
                    { title: configTitle || data.artworkId }
                );
                const shareText = formatTemplate(
                    getText('share.textTemplate', '這是我在勁水國寶展覽中生成的作品 #{id}，快來看看吧！'),
                    { id: data.iterationId }
                );
                const shareData = {
                    title: shareTitle,
                    text: shareText,
                    url: shareLink
                };

                try {
                    if (navigator.share) {
                        await navigator.share(shareData);
                    } else {
                        // Fallback to clipboard
                        await navigator.clipboard.writeText(shareLink);
                        const btn = document.getElementById('copy-btn');
                        const originalText = btn.textContent;
                        btn.textContent = getText('share.success', '連結已複製！');
                        btn.classList.add('success');
                        setTimeout(() => {
                            btn.textContent = originalText;
                            btn.classList.remove('success');
                        }, 2000);
                    }
                } catch (err) {
                    console.log('Error sharing:', err);
                }
            };

        }

        async function displayData(data) {
            updateArtworkText(data);

            // Get initial density ratio and set active quality button
            const density = await getDensityRatio();

            if (window.innerWidth > 768) {
                let activeLevel = 'full';
                const lowVal = currentDensityConfig.lowDesktop || 0.4;
                const medVal = currentDensityConfig.mediumDesktop || 0.75;
                const fullVal = currentDensityConfig.fullDesktop || 1.0;

                if (Math.abs(density - lowVal) < 0.01) {
                    activeLevel = 'low';
                } else if (Math.abs(density - medVal) < 0.01) {
                    activeLevel = 'medium';
                } else if (Math.abs(density - fullVal) < 0.01) {
                    activeLevel = 'full';
                }

                document.querySelectorAll('.quality-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.level === activeLevel);
                });
            }

            // Construct iframe URL
            updateArtworkIframe(density);
        }

        init();
    </script>
</body>

</html>
