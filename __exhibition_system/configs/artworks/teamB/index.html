<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品說明</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
        background-color: #f5f5f5;
        width: 100%;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      .exhibition-container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-wrap: wrap;
        background: white;
        overflow: hidden;
      }

      /* 左側資訊區 */
      .info-section {
        flex: 1 0 50%;
        min-width: 400px;
        background: #f8f8f8;
        padding: 5% 6%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .title-block {
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 3px solid #2c3e50;
      }

      .artwork-title {
        font-size: clamp(32px, 4vw, 56px);
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 15px;
        margin-top: 25px;
        letter-spacing: 0.15em;
      }

      .artist-name {
        font-size: clamp(18px, 2vw, 28px);
        color: #666;
        font-weight: 400;
        letter-spacing: 2px;
      }

      .info-block {
        margin-bottom: 15px;
      }

      .info-label {
        font-size: clamp(20px, 2vw, 26px);
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 15px;
        display: block;
        letter-spacing: 2px;
      }

      .info-content {
        font-size: clamp(16px, 1.5vw, 24px);
        color: #333;
        text-align: justify;
        letter-spacing: 1px;
      }

      .info-content p {
        line-height: 1.6;
        margin-bottom: 0.5em;
      }

      .artifacts-list {
        font-size: clamp(15px, 1.4vw, 23px);
        line-height: 1.8;
        color: #444;
        letter-spacing: 1px;
      }

      /* 右側元素展示區 */
      .element-section {
        flex: 1 0 50%;
        min-width: 400px;
        background: linear-gradient(135deg, #3d5266 0%, #2c3e50 100%);
        padding: 5% 6%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .element-image-container {
        background: white;
        border-radius: 0px;
        padding: 10px;
        margin-bottom: 5vh;
        width: fit-content;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .element-image-container img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 40vh;
        object-fit: contain;
        display: block;
      }

      .element-info {
        color: white;
        width: 100%;
        max-width: 600px;
      }

      .element-label {
        font-size: clamp(20px, 2vw, 26px);
        font-weight: 600;
        color: #b8c5d6;
        margin-bottom: 15px;
        display: block;
        letter-spacing: 2px;
      }

      .element-content {
        font-size: clamp(16px, 1.5vw, 24px);
        color: #e8eef5;
        letter-spacing: 1px;
      }

      .element-content p {
        line-height: 1.6;
        margin-bottom: 0.5em;
      }

      /* 載入中提示 */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 32px;
        color: #666;
      }

      @media (max-width: 1024px) {
        .exhibition-container {
          flex-direction: column;
        }
        .info-section, .element-section {
          flex: 1 0 100%;
          padding: 60px 40px;
        }
      }
    </style>
    <link id="i18nStylesheet" rel="stylesheet" href="/css/i18n.zh.css">
  </head>
  <body>
    <div class="loading i18n-artwork-loading" id="loadingText">載入中...</div>

    <div class="exhibition-container" style="display: none">
      <!-- 左側資訊區 -->
      <div class="info-section">
        <div class="title-block">
          <h1 class="artwork-title i18n-artwork-title" id="title"></h1>
          <p class="artist-name i18n-artwork-members" id="members"></p>
        </div>

        <div class="info-block">
          <span class="info-label i18n-artwork-description-label" id="descriptionLabel">♦︎ 作品論述</span>
          <div class="info-content i18n-artwork-description" id="description"></div>
        </div>

        <div class="info-block">
          <span class="info-label i18n-artwork-artifact-label" id="artifactLabel">♦︎ 結合文物</span>
          <p class="artifacts-list i18n-artwork-artifact" id="artifact"></p>
        </div>
      </div>

      <!-- 右側元素展示區 -->
      <div class="element-section">
        <div
          class="element-image-container"
          id="imageContainer"
          style="display: none"
        >
          <img id="elementImage" src="" alt="文物圖片" />
        </div>

        <div class="element-info">
          <span class="element-label i18n-artwork-element-label" id="elementLabel">♦︎ 元素介紹 ♦︎</span>
          <div class="element-content i18n-artwork-element-content" id="elementContent"></div>
        </div>
      </div>
    </div>

    <script src="/node_modules/marked/lib/marked.umd.js"></script>
    <script>
      const LANG_STORAGE_KEY = "exhibition_lang";
      let currentLang = null;
      let i18nConfig = null;
      const i18nStylesheet = document.getElementById("i18nStylesheet");

      function getQueryParams() {
        return new URLSearchParams(window.location.search);
      }

      function getLang() {
        const params = getQueryParams();
        return params.get("lang") || localStorage.getItem(LANG_STORAGE_KEY) || "zh";
      }

      async function fetchI18n() {
        try {
          const response = await fetch("/config/i18n");
          i18nConfig = await response.json();
        } catch (e) {
          console.error("Failed to load i18n config:", e);
        }
      }

      function getText(path, fallback = "") {
        if (!i18nConfig || !currentLang) return fallback;
        const base = i18nConfig[currentLang] || i18nConfig.zh || {};
        return path.split(".").reduce((acc, key) => acc && acc[key], base) || fallback;
      }

      function applyI18n() {
        document.documentElement.lang = currentLang === "en" ? "en" : "zh-TW";
        document.body.classList.remove("lang-zh", "lang-en");
        document.body.classList.add(currentLang === "en" ? "lang-en" : "lang-zh");
        if (i18nStylesheet) {
          i18nStylesheet.href = `/css/i18n.${currentLang === "en" ? "en" : "zh"}.css`;
        }
        document.getElementById("loadingText").textContent = getText("artworkInfo.loading", "載入中...");
        document.getElementById("descriptionLabel").textContent = getText("artworkInfo.descriptionLabel", "♦︎ 作品論述");
        document.getElementById("artifactLabel").textContent = getText("artworkInfo.artifactLabel", "♦︎ 結合文物");
        document.getElementById("elementLabel").textContent = getText("artworkInfo.elementLabelDefault", "♦︎ 元素介紹 ♦︎");
      }

      function getJsonPath() {
        const params = getQueryParams();
        return params.get("data") || "TeamB.json";
      }

      async function loadExhibitionData() {
        currentLang = getLang();
        await fetchI18n();
        applyI18n();

        const jsonPath = getJsonPath();
        const response = await fetch(jsonPath);
        const data = await response.json();

        // Load main description from .md file
        try {
          const mdLangSuffix = currentLang === "en" ? ".en" : "";
          let mdPath = jsonPath.replace(".json", `${mdLangSuffix}.md`);
          let mdResponse = await fetch(mdPath);
          if (!mdResponse.ok && currentLang === "en") {
            mdPath = jsonPath.replace(".json", ".md");
            mdResponse = await fetch(mdPath);
          }
          if (mdResponse.ok) {
            const mdContent = await mdResponse.text();
            data.description = marked.parse(mdContent);
          }
        } catch (e) {
          console.error("Error loading main description md:", e);
        }
        
        const params = getQueryParams();
        const subtype = params.get("subtype");
        
        // If subtype is present, try to load subtype md file
        if (subtype !== null) {
          try {
            const langSuffix = currentLang === "en" ? ".en" : "";
            let subtypeMdPath = `subtype_${subtype}${langSuffix}.md`;
            let mdResponse = await fetch(subtypeMdPath);
            if (!mdResponse.ok && currentLang === "en") {
              subtypeMdPath = `subtype_${subtype}.md`;
              mdResponse = await fetch(subtypeMdPath);
            }
            if (mdResponse.ok) {
                const mdContent = await mdResponse.text();
                
                // Parse image: ![alt](path)
                const imgMatch = mdContent.match(/!\[.*?\]\((.*?)\)/);
                if (imgMatch) {
                    data.element = data.element || {};
                    data.element.image = imgMatch[1];
                    const subtypeList = currentLang === "en" ? (data.subtypes_en || data.subtypes) : data.subtypes;
                    if (subtypeList && subtypeList[subtype]) {
                        data.element.label = `♦︎ ${subtypeList[subtype]} ♦︎`;
                    }
                    // Remove image tag from content and parse remaining as markdown
                    data.element.content = marked.parse(mdContent.replace(/!\[.*?\]\((.*?)\)/, '').trim());
                }
            }
          } catch (e) {
            console.error("Error loading subtype md:", e);
          }
        }

        displayExhibitionData(data);
      }

      function displayExhibitionData(data) {
        const title = currentLang === "en" ? (data.title_en || data.title) : data.title;
        document.getElementById("title").textContent = title || "";
        const members = currentLang === "en" ? (data.members_en || data.members) : data.members;
        document.getElementById("members").textContent = members
          ? `${getText("artworkInfo.artistsPrefix", "作者：")}${members}`
          : "";

        document.getElementById("description").innerHTML =
          data.description || "";

        const artifact = currentLang === "en" ? (data.artifact_en || data.artifact) : data.artifact;
        document.getElementById("artifact").textContent = artifact || "";

        if (data.element) {
          document.getElementById("elementLabel").textContent =
            data.element.label || getText("artworkInfo.elementLabelDefault", "♦︎ 元素介紹 ♦︎");
          document.getElementById("elementContent").innerHTML =
            data.element.content || "";

          if (data.element.image) {
            document.getElementById("imageContainer").style.display = "flex";
            document.getElementById("elementImage").src = data.element.image;
            document.getElementById("elementImage").alt =
              data.element.imageAlt || getText("artworkInfo.elementImageAlt", "元素圖片");
          }
        }

        document.querySelector(".loading").style.display = "none";
        document.querySelector(".exhibition-container").style.display = "flex";
      }

      window.addEventListener("DOMContentLoaded", loadExhibitionData);
    </script>
  </body>
</html>
