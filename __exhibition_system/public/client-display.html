<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibition Client Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #artworkFrame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: none; /* Hidden until something is picked */
            margin: 0;
            padding: 0;
        }
        #placeholder {
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-family: sans-serif;
            font-size: 32px;
        }
        #fadeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div id="placeholder">Client Display Ready</div>
    <iframe id="artworkFrame"></iframe>
    <div id="fadeOverlay"></div>

    <!-- No Socket.io script needed here, logic is internal/local -->
    <script>
        // --- CONFIGURATION ---
        const FADE_DURATION = 1000; // milliseconds (Fade In/Out time)
        const FADE_COLOR = '#000000'; // Color of the curtain
        const WAIT_BEFORE_REVEAL = 500; // Extra time to wait at full blackout before revealing new artwork
        const IDLE_TIMEOUT = 120 * 1000; // 120 seconds idle time
        // ---------------------

        const frame = document.getElementById('artworkFrame');
        const placeholder = document.getElementById('placeholder');
        const fadeOverlay = document.getElementById('fadeOverlay');

        // Density config
        let densityConfig = { server: 1, client: 1 };
        fetch('/config/density')
            .then(res => res.json())
            .then(data => {
                densityConfig = data;
                console.log("Density config loaded:", densityConfig);
            })
            .catch(err => console.error("Failed to load density config:", err));

        // Apply Config
        fadeOverlay.style.backgroundColor = FADE_COLOR;
        fadeOverlay.style.transition = `opacity ${FADE_DURATION}ms ease-in-out`;

        // State
        let idleTimer = null;

        function resetIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(triggerSelfUpdate, IDLE_TIMEOUT);
        }

        async function triggerSelfUpdate() {
            console.log("Idle timeout reached. Fetching random artwork locally...");
            try {
                const response = await fetch('/api/random-record');
                if (!response.ok) throw new Error("API Error");
                const artwork = await response.json();
                console.log("Self-update with:", artwork.title);
                window.updateArtwork(artwork);
            } catch (e) {
                console.error("Self-update failed:", e);
                // Retry in 10s
                idleTimer = setTimeout(triggerSelfUpdate, 10000);
            }
        }

        // Function to be called by puppeteer (or self)
        window.updateArtwork = (artwork) => {
             console.log("Loading artwork:", artwork.title);
             
             // Reset idle timer whenever we get an update (remote or local)
             resetIdleTimer();
            
            // 1. Start Fade Out (Cover screen)
            fadeOverlay.style.opacity = '1';

            // 2. Wait for fade to complete
            setTimeout(() => {
                // Switch Content
                placeholder.style.display = 'none';
                frame.style.display = 'block';
                
                // Define what happens when the new artwork is loaded
                const onArtworkLoaded = () => {
                    // Remove listener to prevent memory leaks/multiple calls
                    frame.removeEventListener('load', onArtworkLoaded);
                    
                    // Wait a bit (optional stability) then Reveal
                    setTimeout(() => {
                         fadeOverlay.style.opacity = '0';
                    }, WAIT_BEFORE_REVEAL);
                };

                frame.addEventListener('load', onArtworkLoaded);

                // --- Construct URL with Parameters ---
                const params = new URLSearchParams();
                
                // Add Iteration Data if available
                if (artwork.iteration) {
                    if (artwork.iteration.seed) {
                        params.append('seed', artwork.iteration.seed);
                    }
                    if (artwork.iteration.parameters) {
                        for (let [key, value] of Object.entries(artwork.iteration.parameters)) {
                            // Ensure slider parameters (p1, p2, p3) are formatted to 4 decimal places
                            if (['p1', 'p2', 'p3'].includes(key)) {
                                value = Number(value).toFixed(4);
                            }
                            params.append(key, value);
                        }
                    }
                }

                // Add density from config
                if (densityConfig && densityConfig.client) {
                    params.append('density', densityConfig.client);
                }

                const url = `${artwork.artworkUrl}?${params.toString()}`;
                console.log("Loading URL:", url);
                frame.src = url;

            }, FADE_DURATION);
        };
        
        console.log("Client Display loaded. Waiting for external commands via window.updateArtwork()");
        
        // Initial Start: Trigger immediate self-update if nothing happens
        // Or wait for IDLE_TIMEOUT? User said "instead of displaying waiting... randomly pick a work"
        // Let's trigger immediately once.
        triggerSelfUpdate();

    </script>
</body>
</html>
