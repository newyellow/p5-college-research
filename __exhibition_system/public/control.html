<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibition Control Panel</title>
    <style>
        body {
            font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
            background-color: #f5f5f5;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            /* Prevent text selection */
        }

        /* Layout Containers */
        .panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity ease-in-out;
            padding: 40px;
            box-sizing: border-box;
        }

        .panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Setting Panel Styles */
        .sliders-container {
            width: 90%;
            max-width: 800px;
            margin-bottom: 60px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slider-group {
            margin-bottom: 50px;
        }

        .slider-group label {
            font-size: 28px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 25px;
            display: block;
            letter-spacing: 2px;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        /* Track Styles */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
        }

        /* Thumb (Button) Styles */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 36px;
            width: 36px;
            background: #222;
            margin-top: -15px;
            /* Centers thumb on 6px track: (6/2) - (36/2) = -15 */
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            cursor: pointer;
        }

        input[type=range]::-moz-range-thumb {
            height: 36px;
            width: 36px;
            background: #222;
            border: none;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            cursor: pointer;
        }

        input[type=range]:focus {
            outline: none;
        }

        .action-button {
            padding: 30px 80px;
            font-size: 32px;
            font-weight: 600;
            cursor: pointer;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 60px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s, background-color 0.2s;
            margin-bottom: 60px;
            letter-spacing: 4px;
            font-family: inherit;
        }

        .action-button:active {
            transform: scale(0.95);
            background-color: #0056b3;
        }

        /* Display Panel Styles */
        #displayPanel {
            background-color: #2c3e50;
            text-align: center;
            padding: 0 !important;
            overflow: hidden;
            display: block;
            /* Override flex layout to ensure iframe fills space */
            position: relative;
        }

        #iframeFadeOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity ease-in-out;
        }

        #artworkIframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #2c3e50;
            display: block;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .control-buttons-overlay {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 1000;
        }

        .overlay-button {
            padding: 20px 50px;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: opacity 0.5s ease-in, transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            opacity: 0;
            pointer-events: none;
            font-family: inherit;
            letter-spacing: 2px;
        }

        .overlay-button.show {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-button:active {
            transform: scale(0.95) translateY(2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .next-btn {
            background-color: #2c3e50;
            color: white;
            border: 3px solid white;
            padding-left: 100px;
            padding-right: 100px;
        }

        .back-btn {
            background-color: #f8f8f8;
            color: #2c3e50;
            border: 2px solid #2c3e50;
        }

        .regenerate-btn {
            background-color: #e74c3c;
            color: white;
        }

        /* Debug Buttons Styles */
        .debug-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 400px;
            z-index: 2000;
        }

        .debug-btn {
            padding: 10px 15px;
            font-size: 16px;
            font-weight: 600;
            background-color: rgba(44, 62, 80, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .debug-btn:active {
            transform: scale(0.95);
            background-color: #2c3e50;
        }

        /* Team Selection Styles */
        .team-selection-container {
            display: none;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 40px;
            justify-content: center;
            width: 90%;
            max-width: 800px;
        }

        .team-btn {
            flex: 1;
            min-width: 140px;
            padding: 20px 10px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            background-color: #fff;
            color: #2c3e50;
            border: 3px solid #2c3e50;
            border-radius: 15px;
            transition: all 0.2s;
            font-family: inherit;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .team-btn.selected {
            background-color: #2c3e50;
            color: white;
        }

        .team-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <!-- Layout 1: Settings and Submitting -->
    <div id="settingPanel" class="panel active" style="padding-top:100px">
        <h1 style="letter-spacing: 4px;">作品生成設定</h1>

        <div id="teamSelection" class="team-selection-container">
            <!-- Buttons will be generated dynamically -->
        </div>

        <div class="sliders-container">
            <div class="slider-group">
                <label>顏色種子</label>
                <input type="range" id="param1" min="0" max="92" value="46" step="1">
            </div>
            <div class="slider-group">
                <label>密度種子</label>
                <input type="range" id="param2" min="0" max="1000000" value="500000">
            </div>
            <div class="slider-group">
                <label>混亂種子</label>
                <input type="range" id="param3" min="0" max="1000000" value="500000">
            </div>
        </div>

        <button id="generateBtn" class="action-button">生成作品</button>
    </div>

    <div id="debugControls" class="debug-controls"></div>

    <!-- Layout 2: Description Display (now using Iframe) -->
    <div id="displayPanel" class="panel">
        <div id="iframeFadeOverlay"></div>
        <iframe id="artworkIframe" src=""></iframe>

        <div class="control-buttons-overlay">
            <button id="overlayBackBtn" class="overlay-button back-btn">返回說明</button>
            <button id="overlayNextBtn" class="overlay-button next-btn">下一頁</button>
            <button id="overlayRegenBtn" class="overlay-button regenerate-btn">重新生成</button>
        </div>

        <div id="returnHint">Tap the screen to generate next artwork</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/node_modules/marked/lib/marked.umd.js"></script>
    <script>
        // --- CONFIGURATION ---
        const PANEL_FADE_DURATION = 1200; // ms (Transition between panels)
        const IFRAME_CROSSFADE_DURATION = 1200; // ms (Crossfade between description and result)
        const BUTTON_REVEAL_DELAY = 6000; // ms (Wait time before showing buttons)
        const HINT_REVEAL_DELAY = 12000;  // ms (Wait time before showing "Tap to return" hint)
        const HINT_FADE_DURATION = 2400; // ms (Fade in time for the hint)
        // ---------------------

        const socket = io();

        // Elements
        const settingPanel = document.getElementById('settingPanel');
        const displayPanel = document.getElementById('displayPanel');
        const generateBtn = document.getElementById('generateBtn');
        const returnHint = document.getElementById('returnHint');
        const artworkIframe = document.getElementById('artworkIframe');
        const iframeFadeOverlay = document.getElementById('iframeFadeOverlay');
        const debugControls = document.getElementById('debugControls');

        const overlayNextBtn = document.getElementById('overlayNextBtn');
        const overlayBackBtn = document.getElementById('overlayBackBtn');
        const overlayRegenBtn = document.getElementById('overlayRegenBtn');
        const teamSelection = document.getElementById('teamSelection');
        let teamBtns = []; // Will be populated dynamically

        // State
        let isAnimating = false;
        let isWaitingForReturn = false;
        let currentArtwork = null;
        let currentViewState = 'info'; // 'info' or 'result'
        let hasInitialRevealHappened = false;
        let isDebugEnabled = false;
        let selectedTeamId = null;

        // Init Styles
        settingPanel.style.transitionDuration = `${PANEL_FADE_DURATION}ms`;
        displayPanel.style.transitionDuration = `${PANEL_FADE_DURATION}ms`;
        iframeFadeOverlay.style.transitionDuration = `${IFRAME_CROSSFADE_DURATION / 2}ms`;
        returnHint.style.transitionDuration = `${HINT_FADE_DURATION}ms`;

        // --- FETCH CONFIG ---
        async function fetchConfig() {
            try {
                const response = await fetch('/config/control-setting');
                const config = await response.json();

                if (config.enableTeamSelection && config.artworks) {
                    teamSelection.style.display = 'flex';
                    teamSelection.innerHTML = ''; // Clear existing
                    teamBtns = []; // Reset array

                    config.artworks.forEach(art => {
                        const btn = document.createElement('button');
                        btn.className = 'team-btn';
                        btn.setAttribute('data-team', art.id);
                        btn.textContent = art.title;

                        btn.addEventListener('click', () => {
                            if (selectedTeamId === art.id) {
                                selectedTeamId = null;
                                btn.classList.remove('selected');
                            } else {
                                teamBtns.forEach(b => b.classList.remove('selected'));
                                btn.classList.add('selected');
                                selectedTeamId = art.id;
                            }
                        });

                        teamSelection.appendChild(btn);
                        teamBtns.push(btn);
                    });
                } else {
                    teamSelection.style.display = 'none';
                }
            } catch (err) {
                console.error('Failed to load control settings:', err);
            }
        }
        fetchConfig();

        // --- DEBUG MODE LOGIC ---
        function toggleDebugMode() {
            isDebugEnabled = !isDebugEnabled;
            console.log('Debug mode:', isDebugEnabled);
            if (isDebugEnabled) {
                if (settingPanel.classList.contains('active')) {
                    debugControls.style.display = 'flex';
                }
                if (debugControls.children.length === 0) {
                    setupDebugButtons();
                }
            } else {
                debugControls.style.display = 'none';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't') {
                toggleDebugMode();
            }
        });

        function setupDebugButtons() {
            const types = ['A', 'B', 'C', 'D', 'E'];
            types.forEach(type => {
                for (let i = 1; i <= 3; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'debug-btn';
                    btn.textContent = `${type}-${i}`;
                    btn.onclick = () => {
                        const teamId = `Team${type}`;
                        const subtype = i - 1; // 1-indexed to 0-indexed
                        handleGenerateClick(teamId, subtype);
                    };
                    debugControls.appendChild(btn);
                }
            });
        }

        function handleGenerateClick(targetId = null, specificSubtype = null) {
            if (isAnimating) return;

            isAnimating = true; // Lock interaction

            // Collect Slider Values (Normalize to 0-1 and fix length to 0.0000)
            const params = {
                p1: (document.getElementById('param1').value / 92).toFixed(4),
                p2: (document.getElementById('param2').value / 1000000).toFixed(4),
                p3: (document.getElementById('param3').value / 1000000).toFixed(4),
                subtype: specificSubtype !== null ? specificSubtype : Math.floor(Math.random() * 3)
            };

            if (targetId) {
                params.targetId = targetId;
            }

            // 1. Send Request
            socket.emit('pick-random', params);

            // The actual transition happens when we get data back (in socket.on)
            settingPanel.classList.remove('active');
            debugControls.style.display = 'none';
        }

        const updateControlPanel = (artwork) => {
            currentArtwork = artwork;
            currentViewState = 'info';
            hasInitialRevealHappened = false;

            // Hide buttons initially
            hideAllOverlayButtons();

            // Use standardized infoUrl from server
            const baseUrl = artwork.infoUrl;
            const jsonFile = artwork.id + '.json'; // Still need this for the 'data' param
            const params = new URLSearchParams();
            params.append('data', jsonFile);

            // Pass subtype if available
            if (artwork.iteration && artwork.iteration.parameters && artwork.iteration.parameters.subtype !== undefined) {
                params.append('subtype', artwork.iteration.parameters.subtype);
            }

            artworkIframe.src = `${baseUrl}?${params.toString()}`;

            // Perform Transition: Setting -> Display
            performTransitionToDisplay();

            // Show "Next" button after delay
            setTimeout(() => {
                if (currentViewState === 'info' && currentArtwork === artwork) {
                    hasInitialRevealHappened = true;
                    showButtonsForState('info');
                }
            }, BUTTON_REVEAL_DELAY);
        };

        function switchIframeWithFade(url) {
            const halfDuration = IFRAME_CROSSFADE_DURATION / 2;
            iframeFadeOverlay.style.opacity = '1';
            setTimeout(() => {
                artworkIframe.src = url;
                // Wait for the next frame to ensure src has changed and browser started loading
                setTimeout(() => {
                    iframeFadeOverlay.style.opacity = '0';
                }, 50); // Small delay to hide the initial load blink
            }, halfDuration);
        }

        function hideAllOverlayButtons() {
            overlayNextBtn.classList.remove('show');
            overlayBackBtn.classList.remove('show');
            overlayRegenBtn.classList.remove('show');
        }

        function showButtonsForState(state) {
            hideAllOverlayButtons();
            if (state === 'info') {
                overlayNextBtn.classList.add('show');
            } else if (state === 'result') {
                overlayBackBtn.classList.add('show');
                overlayRegenBtn.classList.add('show');
            }
        }

        // Overlay Button Events
        overlayNextBtn.addEventListener('click', () => {
            if (!currentArtwork) return;
            currentViewState = 'result';

            // Switch buttons immediately if reveal happened
            if (hasInitialRevealHappened) {
                showButtonsForState('result');
            }

            const teamFolder = currentArtwork.id.toLowerCase();
            const baseUrl = currentArtwork.resultUrl;

            // Pass parameters if available
            const params = new URLSearchParams();
            if (currentArtwork.iteration) {
                // Add seed and team ID
                if (currentArtwork.iteration.seed) params.append('seed', currentArtwork.iteration.seed);
                if (currentArtwork.iteration.pickedTeamId) params.append('id', currentArtwork.iteration.pickedTeamId);

                // Add slider parameters
                if (currentArtwork.iteration.parameters) {
                    for (const [key, value] of Object.entries(currentArtwork.iteration.parameters)) {
                        params.append(key, value);
                    }
                }
            }

            switchIframeWithFade(`${baseUrl}?${params.toString()}`);
        });

        overlayBackBtn.addEventListener('click', () => {
            if (!currentArtwork) return;
            currentViewState = 'info';

            // Switch buttons immediately
            if (hasInitialRevealHappened) {
                showButtonsForState('info');
            }

            const baseUrl = currentArtwork.infoUrl;
            const jsonFile = currentArtwork.id + '.json';
            const params = new URLSearchParams();
            params.append('data', jsonFile);

            // Pass subtype if available
            if (currentArtwork.iteration && currentArtwork.iteration.parameters && currentArtwork.iteration.parameters.subtype !== undefined) {
                params.append('subtype', currentArtwork.iteration.parameters.subtype);
            }

            switchIframeWithFade(`${baseUrl}?${params.toString()}`);
        });

        overlayRegenBtn.addEventListener('click', () => {
            performTransitionToSettings();
        });

        // Listen for 'artwork-current' (new explicit event for local update)
        socket.on('artwork-current', updateControlPanel);

        // Also listen for 'artwork-selected' (legacy fallback)
        socket.on('artwork-selected', updateControlPanel);

        // Event: Generate Button Click
        generateBtn.addEventListener('click', () => {
            handleGenerateClick(selectedTeamId);
        });

        // Event: Screen Tap (Return)
        // Only allow tap to return if we are in result state or after a long timeout
        document.addEventListener('click', (e) => {
            if (e.target === generateBtn || generateBtn.contains(e.target)) return;
            if (e.target.closest('.control-buttons-overlay')) return;

            if (isWaitingForReturn && !isAnimating) {
                performTransitionToSettings();
            }
        });

        function performTransitionToDisplay() {
            settingPanel.classList.remove('active');
            debugControls.style.display = 'none';

            setTimeout(() => {
                displayPanel.classList.add('active');

                setTimeout(() => {
                    isAnimating = false;

                    setTimeout(() => {
                        returnHint.style.opacity = '1';
                        isWaitingForReturn = true;
                    }, HINT_REVEAL_DELAY);

                }, PANEL_FADE_DURATION);
            }, PANEL_FADE_DURATION);
        }

        function performTransitionToSettings() {
            isAnimating = true;
            isWaitingForReturn = false;
            hideAllOverlayButtons();

            displayPanel.classList.remove('active');
            returnHint.style.opacity = '0';

            setTimeout(() => {
                settingPanel.classList.add('active');
                if (isDebugEnabled) debugControls.style.display = 'flex';
                artworkIframe.src = "about:blank"; // Clear iframe

                // Clear team selection
                selectedTeamId = null;
                teamBtns.forEach(btn => btn.classList.remove('selected'));

                setTimeout(() => {
                    isAnimating = false;
                }, PANEL_FADE_DURATION);

            }, PANEL_FADE_DURATION);
        }

    </script>
</body>

</html>
