<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生成結果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
        background: linear-gradient(135deg, #3d5266 0%, #2c3e50 100%);
        width: 100%;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .result-container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: row; /* Change to row for left-right layout */
        align-items: center;
        justify-content: center;
        gap: 8vw;
        padding: 40px 60px 120px 60px; /* More bottom padding for buttons */
        overflow: hidden;
      }

      .info-section {
        display: flex;
        flex-direction: column;
        align-items: center; /* Center items within the section */
        gap: 3vh;
        width: 100%;
        max-width: 600px;
      }

      .artwork-header {
        color: white;
        margin-bottom: 10px;
        width: 100%;
        text-align: center; /* Center the title text */
      }

      .artwork-title {
        font-size: clamp(32px, 4vw, 52px);
        font-weight: 700;
        letter-spacing: 4px;
        margin-bottom: 5px;
        text-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }

      .qr-container {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 420px;
        flex-shrink: 0; /* Don't shrink QR code */
      }

      .qr-code {
        width: 100%;
        aspect-ratio: 1/1;
        max-width: 320px;
        background: #f5f5f5;
        border: 3px dashed #ccc;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        font-size: 18px;
      }

      .qr-text {
        font-size: clamp(16px, 2vw, 20px);
        color: #333;
        font-weight: 600;
        letter-spacing: 2px;
        text-align: center;
      }

      /* 參數顯示區 */
      .params-container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        padding: 25px 35px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 500px;
      }

      .params-title {
        font-size: clamp(18px, 2vw, 22px);
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 15px;
        text-align: center;
        letter-spacing: 2px;
      }

      .param-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #e0e0e0;
        font-size: clamp(14px, 1.5vw, 18px);
      }

      .param-item:last-child {
        border-bottom: none;
      }

      .param-label {
        color: #555;
        font-weight: 600;
      }

      .param-value {
        color: #2c3e50;
        font-weight: 700;
        font-family: "Courier New", monospace;
      }
    </style>
    <link id="i18nStylesheet" rel="stylesheet" href="/css/i18n.zh.css">
  </head>
  <body>
    <div class="result-container">
      <!-- QR Code Section (Left) -->
      <div class="qr-container">
        <p class="qr-text i18n-result-qr-text" id="qrText">掃描保存作品成果</p>
        <div class="qr-code" id="qrCode">QR Code 區域</div>
      </div>

      <!-- Info Section (Right) -->
      <div class="info-section">
        <div class="artwork-header">
            <h1 class="artwork-title i18n-artwork-title" id="artworkTitleDisplay">-</h1>
        </div>

        <!-- 參數顯示區 -->
        <div class="params-container">
            <div class="params-title i18n-result-params-title" id="paramsTitle">生成參數</div>
            <div class="param-item">
                <span class="param-label i18n-result-param-label" id="subtypeLabel">生成類別</span>
                <span class="param-value i18n-result-subtype-value" id="subtypeValue">-</span>
            </div>
            <div class="param-item">
                <span class="param-label i18n-result-param-label" id="param1Label">顏色種子</span>
                <span class="param-value" id="param1Value">-</span>
            </div>
            <div class="param-item">
                <span class="param-label i18n-result-param-label" id="param2Label">密度種子</span>
                <span class="param-value" id="param2Value">-</span>
            </div>
            <div class="param-item">
                <span class="param-label i18n-result-param-label" id="param3Label">混亂種子</span>
                <span class="param-value" id="param3Value">-</span>
            </div>
        </div>
      </div>
    </div>

    <script src="/js/qrcode.min.js"></script>
    <script src="/js/QRCodeManager.js"></script>
    <script>
      // Configuration for the separate host where artworks can be viewed
      const ARTWORK_VIEW_BASE_URL = "https://lanyang.newyellow.xyz/"; // Change this to your actual URL
      // const ARTWORK_VIEW_BASE_URL = "http://localhost:3600/";

      const LANG_STORAGE_KEY = "exhibition_lang";
      let currentLang = null;
      let i18nConfig = null;
      const i18nStylesheet = document.getElementById("i18nStylesheet");

      function getQueryParams() {
        return new URLSearchParams(window.location.search);
      }

      function getLang() {
        const params = getQueryParams();
        return params.get("lang") || localStorage.getItem(LANG_STORAGE_KEY) || "zh";
      }

      async function fetchI18n() {
        try {
          const response = await fetch("/config/i18n");
          i18nConfig = await response.json();
        } catch (e) {
          console.error("Failed to load i18n config:", e);
        }
      }

      function getText(path, fallback = "") {
        if (!i18nConfig || !currentLang) return fallback;
        const base = i18nConfig[currentLang] || i18nConfig.zh || {};
        return path.split(".").reduce((acc, key) => acc && acc[key], base) || fallback;
      }

      function applyI18n() {
        document.documentElement.lang = currentLang === "en" ? "en" : "zh-TW";
        document.body.classList.remove("lang-zh", "lang-en");
        document.body.classList.add(currentLang === "en" ? "lang-en" : "lang-zh");
        if (i18nStylesheet) {
          i18nStylesheet.href = `/css/i18n.${currentLang === "en" ? "en" : "zh"}.css`;
        }
        document.title = getText("result.title", "生成結果");
        document.getElementById("qrText").textContent = getText("result.qrText", "掃描保存作品成果");
        const qrCode = document.getElementById("qrCode");
        if (qrCode && !qrCode.querySelector("img")) {
          qrCode.textContent = getText("result.qrPlaceholder", "QR Code 區域");
        }
        document.getElementById("paramsTitle").textContent = getText("result.paramsTitle", "生成參數");
        document.getElementById("subtypeLabel").textContent = getText("result.subtypeLabel", "生成類別");
        document.getElementById("param1Label").textContent = getText("result.colorSeedLabel", "顏色種子");
        document.getElementById("param2Label").textContent = getText("result.densitySeedLabel", "密度種子");
        document.getElementById("param3Label").textContent = getText("result.chaosSeedLabel", "混亂種子");
      }

      async function displayParamsAndQRCode() {
        currentLang = getLang();
        await fetchI18n();
        applyI18n();

        const params = getQueryParams();

        const p1 = params.get("p1");
        const p2 = params.get("p2");
        const p3 = params.get("p3");
        const subtype = params.get("subtype");
        const seed = params.get("seed");
        const id = params.get("id");

        // Format parameters to fixed length strings (0.0000)
        const formatParam = (val) => val ? Number(val).toFixed(4) : null;
        const fp1 = formatParam(p1);
        const fp2 = formatParam(p2);
        const fp3 = formatParam(p3);

        if (fp1) document.getElementById("param1Value").textContent = fp1;
        if (fp2) document.getElementById("param2Value").textContent = fp2;
        if (fp3) document.getElementById("param3Value").textContent = fp3;

        // Fetch Artwork Config to get subtype name
        if (id && subtype !== null) {
            try {
                // Folder is lowercase version of ID (TeamA -> teamA)
                const folder = id.toLowerCase();
                const configUrl = `/artwork-configs/${folder}/${id}.json`;
                const response = await fetch(configUrl);
                if (response.ok) {
                    const config = await response.json();
                    
                    // Display Title
                    const title =
                      currentLang === "en" ? (config.title_en || config.title) : config.title;
                    if (title) {
                        document.getElementById("artworkTitleDisplay").textContent = title;
                    }

                    const subtypes =
                      currentLang === "en" ? (config.subtypes_en || config.subtypes) : config.subtypes;
                    if (subtypes && subtypes[subtype]) {
                        document.getElementById("subtypeValue").textContent = subtypes[subtype];
                    } else {
                        document.getElementById("subtypeValue").textContent =
                          `${getText("result.subtypeFallback", "類別")} ${subtype}`;
                    }
                }
            } catch (e) {
                console.error("Error fetching artwork config for subtype name:", e);
                document.getElementById("subtypeValue").textContent =
                  `${getText("result.subtypeFallback", "類別")} ${subtype}`;
            }
        }

        // Generate QR Code
        const qrManager = new QRCodeManager("qrCode", {
            width: 320,
            height: 320
        });

        // Collect all parameters for the QR code URL
        const qrParams = {};
        if (id) qrParams.id = id;
        if (seed) qrParams.seed = seed;
        if (subtype !== null) qrParams.subtype = subtype;
        if (fp1) qrParams.p1 = fp1;
        if (fp2) qrParams.p2 = fp2;
        if (fp3) qrParams.p3 = fp3;

        const shareURL = QRCodeManager.constructURL(ARTWORK_VIEW_BASE_URL, qrParams);
        console.log("QR Code URL:", shareURL);
        qrManager.generate(shareURL);
      }

      window.addEventListener("DOMContentLoaded", displayParamsAndQRCode);
    </script>
  </body>
</html>
