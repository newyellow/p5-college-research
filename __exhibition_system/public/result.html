<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生成結果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
        background: linear-gradient(135deg, #3d5266 0%, #2c3e50 100%);
        width: 100%;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .result-container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5vh;
        padding: 40px 20px;
        overflow: hidden;
      }

      .info-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5vh;
        width: 100%;
        max-width: 600px;
      }

      .qr-container {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 420px;
      }

      .qr-code {
        width: 100%;
        aspect-ratio: 1/1;
        max-width: 320px;
        background: #f5f5f5;
        border: 3px dashed #ccc;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        font-size: 18px;
      }

      .qr-text {
        font-size: clamp(16px, 2vw, 20px);
        color: #333;
        font-weight: 600;
        letter-spacing: 2px;
        text-align: center;
      }

      /* 參數顯示區 */
      .params-container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        padding: 25px 35px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 420px;
      }

      .params-title {
        font-size: clamp(18px, 2vw, 22px);
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 15px;
        text-align: center;
        letter-spacing: 2px;
      }

      .param-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #e0e0e0;
        font-size: clamp(14px, 1.5vw, 18px);
      }

      .param-item:last-child {
        border-bottom: none;
      }

      .param-label {
        color: #555;
        font-weight: 600;
      }

      .param-value {
        color: #2c3e50;
        font-weight: 700;
        font-family: "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div class="result-container">
      <div class="info-section">
        <div class="qr-container">
          <p class="qr-text">掃描下載作品圖片</p>
          <div class="qr-code" id="qrCode">QR Code 區域</div>
        </div>

        <!-- 參數顯示區 -->
        <div class="params-container">
            <div class="params-title">生成參數</div>
            <div class="param-item">
                <span class="param-label">顏色種子</span>
                <span class="param-value" id="param1Value">-</span>
            </div>
            <div class="param-item">
                <span class="param-label">密度種子</span>
                <span class="param-value" id="param2Value">-</span>
            </div>
            <div class="param-item">
                <span class="param-label">混亂種子</span>
                <span class="param-value" id="param3Value">-</span>
            </div>
        </div>
      </div>
    </div>

    <script src="/js/qrcode.min.js"></script>
    <script src="/js/QRCodeManager.js"></script>
    <script>
      // Configuration for the separate host where artworks can be viewed
      const ARTWORK_VIEW_BASE_URL = "https://your-exhibition-website.com"; // Change this to your actual URL

      function displayParamsAndQRCode() {
        const params = new URLSearchParams(window.location.search);

        const p1 = params.get("p1");
        const p2 = params.get("p2");
        const p3 = params.get("p3");
        const seed = params.get("seed");
        const id = params.get("id");

        // Format parameters to fixed length strings (0.0000)
        const formatParam = (val) => val ? Number(val).toFixed(4) : null;
        const fp1 = formatParam(p1);
        const fp2 = formatParam(p2);
        const fp3 = formatParam(p3);

        if (fp1) document.getElementById("param1Value").textContent = fp1;
        if (fp2) document.getElementById("param2Value").textContent = fp2;
        if (fp3) document.getElementById("param3Value").textContent = fp3;

        // Generate QR Code
        const qrManager = new QRCodeManager("qrCode", {
            width: 320,
            height: 320
        });

        // Collect all parameters for the QR code URL
        const qrParams = {};
        if (id) qrParams.id = id;
        if (seed) qrParams.seed = seed;
        if (fp1) qrParams.p1 = fp1;
        if (fp2) qrParams.p2 = fp2;
        if (fp3) qrParams.p3 = fp3;

        const shareURL = QRCodeManager.constructURL(ARTWORK_VIEW_BASE_URL, qrParams);
        qrManager.generate(shareURL);
      }

      window.addEventListener("DOMContentLoaded", displayParamsAndQRCode);
    </script>
  </body>
</html>
