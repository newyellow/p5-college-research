<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibition Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #artworkFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Hidden until something is picked */
        }
        #placeholder {
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-family: sans-serif;
            font-size: 32px;
        }
    </style>
</head>
<body>

    <div id="placeholder">Waiting for artwork...</div>
    <iframe id="artworkFrame"></iframe>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const frame = document.getElementById('artworkFrame');
        const placeholder = document.getElementById('placeholder');

        socket.on('artwork-selected', (artwork) => {
            console.log("Loading artwork:", artwork.title);
            placeholder.style.display = 'none';
            frame.style.display = 'block';
            frame.src = artwork.path;
        });
    </script>
</body>
</html>
