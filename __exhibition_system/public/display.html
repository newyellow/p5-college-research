<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibition Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #artworkFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Hidden until something is picked */
        }
        #placeholder {
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-family: sans-serif;
            font-size: 32px;
        }
        #fadeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div id="placeholder">Waiting for artwork...</div>
    <iframe id="artworkFrame"></iframe>
    <div id="fadeOverlay"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- CONFIGURATION ---
        const FADE_DURATION = 1000; // milliseconds (Fade In/Out time)
        const FADE_COLOR = '#000000'; // Color of the curtain
        const WAIT_BEFORE_REVEAL = 500; // Extra time to wait at full blackout before revealing new artwork
        // ---------------------

        const socket = io();
        const frame = document.getElementById('artworkFrame');
        const placeholder = document.getElementById('placeholder');
        const fadeOverlay = document.getElementById('fadeOverlay');

        // Density config
        let densityConfig = { server: 1, client: 1 };
        fetch('/config/density')
            .then(res => res.json())
            .then(data => {
                densityConfig = data;
                console.log("Density config loaded:", densityConfig);
            })
            .catch(err => console.error("Failed to load density config:", err));

        // Apply Config
        fadeOverlay.style.backgroundColor = FADE_COLOR;
        fadeOverlay.style.transition = `opacity ${FADE_DURATION}ms ease-in-out`;

        const updateDisplay = (artwork) => {
             console.log("Loading artwork:", artwork.title);
            
            // 1. Start Fade Out (Cover screen)
            fadeOverlay.style.opacity = '1';

            // 2. Wait for fade to complete
            setTimeout(() => {
                // Switch Content
                placeholder.style.display = 'none';
                
                // --- ROBUST IFRAME CLEANUP ---
                // To prevent memory leaks, we remove the old iframe and create a new one.
                // This is more effective than just changing .src in many browsers.
                const oldFrame = document.getElementById('artworkFrame');
                const parent = oldFrame.parentNode;
                
                // Clear the old frame explicitly before removing
                oldFrame.src = 'about:blank';
                
                const newFrame = document.createElement('iframe');
                newFrame.id = 'artworkFrame';
                newFrame.style.width = '100%';
                newFrame.style.height = '100%';
                newFrame.style.border = 'none';
                newFrame.style.display = 'block';
                
                // Replace old frame with new one
                parent.replaceChild(newFrame, oldFrame);
                
                // Define what happens when the new artwork is loaded
                const onArtworkLoaded = () => {
                    // Remove listener to prevent memory leaks/multiple calls
                    newFrame.removeEventListener('load', onArtworkLoaded);
                    
                    // Wait a bit (optional stability) then Reveal
                    setTimeout(() => {
                         fadeOverlay.style.opacity = '0';
                    }, WAIT_BEFORE_REVEAL);
                };

                newFrame.addEventListener('load', onArtworkLoaded);

                // --- Construct URL with Parameters ---
                const params = new URLSearchParams();
                
                // Add Iteration Data if available
                if (artwork.iteration) {
                    if (artwork.iteration.seed) {
                        params.append('seed', artwork.iteration.seed);
                    }
                    if (artwork.iteration.parameters) {
                        for (let [key, value] of Object.entries(artwork.iteration.parameters)) {
                            // Ensure slider parameters (p1, p2, p3) are formatted to 4 decimal places
                            if (['p1', 'p2', 'p3'].includes(key)) {
                                value = Number(value).toFixed(4);
                            }
                            params.append(key, value);
                        }
                    }
                }

                // Add density from config
                if (densityConfig && densityConfig.server) {
                    params.append('density', densityConfig.server);
                }

                const url = `${artwork.artworkUrl}?${params.toString()}`;
                console.log("Loading URL:", url);
                newFrame.src = url;

            }, FADE_DURATION);
        };

        // Listen for 'artwork-current' (new explicit event for server display)
        socket.on('artwork-current', updateDisplay);
        
        // Also listen for 'artwork-selected' (legacy fallback)
        socket.on('artwork-selected', updateDisplay);
    </script>
</body>
</html>
